<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        #videoContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #statusOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            color: white;
            text-align: center;
            font-size: 0.875rem;
            z-index: 10;
        }
        
        .status-connected {
            color: #4ade80;
        }
        
        .status-error {
            color: #f87171;
        }
        
        #errorMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
            max-width: 80%;
            z-index: 100;
        }
        
        #errorMessage h2 {
            margin-bottom: 1rem;
            color: #f87171;
        }
        
        #errorMessage p {
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        
        .hidden {
            display: none;
        }
        
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }
        
        .indicator-active {
            background: #4ade80;
        }
        
        .indicator-inactive {
            background: #f87171;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="statusOverlay">
        <span class="indicator indicator-inactive" id="statusIndicator"></span>
        <span id="statusText">Initializing camera...</span>
    </div>
    
    <div id="videoContainer">
        <video id="cameraVideo" autoplay playsinline></video>
    </div>
    
    <div id="errorMessage" class="hidden">
        <h2>⚠️ Camera Access Required</h2>
        <p id="errorText"></p>
    </div>
    
    <script src="/static/mobile/camera.js"></script>
</body>
</html>
